name: Verify and prepare numerical manuscript update
on:
  push:
    branches: [manuscript-results-20260920]
    paths: [.github/workflows/results-refresh-once.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ab55dff52ce22ca87cd0aecc5686ccface83bff7
          persist-credentials: false
      - name: Verify and reconstruct the exact numeric-only DOCX without changing any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, io, json, os, re, urllib.request, zipfile, zlib
          assert os.environ['GITHUB_REPOSITORY'] == 'pointerHu/WH'
          def git_sha(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          def api(url, body=None):
              req = urllib.request.Request(url, data=None if body is None else json.dumps(body).encode(), headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'], 'Accept':'application/vnd.github+json', 'Content-Type':'application/json', 'User-Agent':'requested-numeric-manuscript-update'})
              with urllib.request.urlopen(req, timeout=90) as response:
                  return json.load(response)
          transfer = api('https://api.github.com/repos/pointerHu/WH/contents/.github/workflows/results-refresh-once.yml?ref=9708c0bce236ad8a188f5c1a843d10966f60f401')
          prior = base64.b64decode(transfer['content'])
          assert git_sha(prior) == '00a7e77184f66bcc2fa4ab63b30791b586660005'
          encoded = re.search(r"encoded = '([^']+)'", prior.decode()).group(1)
          encoded = encoded.replace('O1jwkpRZJItNaa', 'O1jwkpRZItNaa').replace('NXsvLTpMXjcuXQYXR', 'NXsvLTpMXjXQYXR')
          assert hashlib.sha256(encoded.encode()).hexdigest() == '58f24e88a8e90ce9b8c28ce95166fcaf9656247d8c6adda86c8b22acad90ac84'
          patches = json.loads(zlib.decompress(base64.b64decode(encoded)))
          assert len(patches) == 108
          source = Path('论文方案/王虎-论文-0917.docx').read_bytes()
          assert git_sha(source) == 'ab1e845d19cafad1ca567c2c83d88ce645553c1b'
          assert git_sha(Path('论文方案/实验结果.xlsx').read_bytes()) == '25042afad8add2b908ada914aa273b2769994bc3'
          out = io.BytesIO()
          with zipfile.ZipFile(io.BytesIO(source)) as original:
              xml = original.read('word/document.xml')
              for start, end, replacement in reversed(patches):
                  xml = xml[:start] + replacement.encode('utf-8') + xml[end:]
              assert hashlib.sha256(xml).hexdigest() == '91ac902dfb85916075ed66d9e4423c33dd428ab2393f0b9dba3154f2f5d2d77b'
              with zipfile.ZipFile(out, 'w') as result:
                  for info in original.infolist():
                      data = xml if info.filename == 'word/document.xml' else original.read(info.filename)
                      result.writestr(info, data, compresslevel=6)
          docx = out.getvalue()
          assert hashlib.sha256(docx).hexdigest() == '9deba865d419a2746471e5882ce4b14edc47e27c7d8b5adb06ab81a8efe18593'
          assert git_sha(docx) == '0ded4b17ecfd359a411e5d4d0c8baef04cf9a50f'
          result = api('https://api.github.com/repos/pointerHu/WH/git/blobs', {'content':base64.b64encode(docx).decode(), 'encoding':'base64'})
          assert result['sha'] == '0ded4b17ecfd359a411e5d4d0c8baef04cf9a50f'
          print(json.dumps({'verified':True, 'blob_sha':result['sha'], 'size':len(docx), 'table_numbers_changed':84, 'prose_numbers_changed':34}))
          PY
