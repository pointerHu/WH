name: Prepare verified CGTA manuscript rename
on:
  push:
    branches: [manuscript-cgta-20260920]
    paths: [.github/workflows/cgta-manuscript-once.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 2f859bb100f360ba04e332c3341de999ff02fb63
          persist-credentials: false
      - name: Apply and verify only the requested manuscript terminology changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import copy,hashlib,io,json,os,urllib.request,zipfile
          def gitsha(data):
              return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          source=Path('论文方案/王虎-论文-0917.docx').read_bytes()
          assert gitsha(source)=='7be7b980abcaece67f021137c5050a08576cbf6c'
          z=zipfile.ZipFile(io.BytesIO(source))
          old=z.read('word/document.xml').decode('utf-8')
          assert hashlib.sha256(old.encode()).hexdigest()=='48717e1cd7d9d66038489075e7601829696d6c1e728b24731a6357775ba9cd56'
          patches=[[7915,7915,"类别条件"],[7917,7919,"聚合"],[7937,7941,"类别条件"],[7945,7947,"聚合"],[7949,7949,"（CGTA）"],[11699,11700,"Agg"],[11701,11701,"egati"],[11702,11703,""],[11704,11708,""],[18843,18847,"类别条件"],[18851,18853,"聚合"],[18856,18857,"C"],[18859,18860,"A"],[18861,18864,"Cl"],[18865,18865,"ss-Co"],[18866,18866,"di"],[18868,18874,"on"],[18895,18896,"Agg"],[18897,18897,"egati"],[18898,18899,""],[18900,18904,""],[18970,18970,"、加权"],[18971,18973,"聚合"],[19079,19081,"时序聚合"],[19171,19173,"类别条件聚合"],[20211,20215,"类别条件"],[20219,20221,"聚合"],[20223,20223,"（CGTA）"],[20264,20264,"并加权聚合"],[20797,20797,"类别条件"],[20799,20801,"聚合"],[31760,31762,"聚合"],[31766,31766,"定位并汇"],[31767,31768,""],[52525,52527,""],[52529,52533,"条件高斯时序聚合（C"],[52535,52536,"A）"],[52576,52578,"加权"],[80999,81003,"类别条件"],[81007,81009,"聚合"],[81011,81011,"（CGTA）"],[81125,81127,"时序聚合"],[81128,81128,"语义"],[81151,81155,"类别条件"],[81159,81161,"聚合"],[81204,81204,"并加权聚合"],[89233,89234,"C"],[89236,89237,"A"],[89284,89284,"通过连续加权与聚合"],[197436,197440,"类别条件"],[197444,197446,"聚合"],[199204,199208,"类别条件"],[199212,199214,"聚合"],[199215,199216,"C"],[199218,199219,"A"],[199220,199223,"Cl"],[199224,199224,"ss-Co"],[199225,199225,"di"],[199227,199233,"on"],[199254,199255,"Agg"],[199256,199256,"egati"],[199257,199258,""],[199259,199263,""],[199363,199363,"并加权聚合"],[199399,199401,"聚合"],[290470,290472,"聚合"],[290762,290762,"并聚合"],[290805,290809,"加权聚合过程"],[403080,403083,"加权"],[403084,403084,"合得到"],[502680,502682,"加权"],[677356,677356,"CGTA中的"],[1204434,1204435,"C"],[1204437,1204438,"A"],[1235238,1235238,"L与"],[1235526,1235527,""],[1235831,1235832,"C"],[1235834,1235835,"A"],[1238649,1238650,"C"],[1238652,1238653,"A"],[1242009,1242010,"C"],[1242012,1242013,"A"],[1246142,1246143,"C"],[1246145,1246146,"A"],[1292077,1292078,"C"],[1292080,1292081,"A"],[1362161,1362162,"C"],[1362164,1362165,"A"],[1362606,1362607,"采用完整C"],[1362609,1362610,"A的模型"],[1363650,1363650,"CGTA中"],[1366566,1366566," CGTA中"],[2022017,2022026,"通过类别条件高斯时序聚合（CGTA）在"],[2022031,2022032,"两条时间轴上"],[2022034,2022041,"加权汇聚类别相关证据"],[2022091,2022093,"聚合"]]
          revised=old
          for start,end,text in sorted(patches,reverse=True):
              revised=revised[:start]+text+revised[end:]
          assert hashlib.sha256(revised.encode()).hexdigest()=='d96b3a0c475632d3c31694022bfc1fe81011ab1641a8801431d0e2429f71fb5b'
          output=io.BytesIO()
          with zipfile.ZipFile(output,'w') as out:
              for info in z.infolist():
                  data=revised.encode('utf-8') if info.filename=='word/document.xml' else z.read(info.filename)
                  out.writestr(copy.copy(info),data)
          docx=output.getvalue()
          check=zipfile.ZipFile(io.BytesIO(docx))
          assert check.testzip() is None
          assert [n for n in z.namelist() if z.read(n)!=check.read(n)]==['word/document.xml']
          assert hashlib.sha256(docx).hexdigest()=='2da96a1626fdcb1fb2107b68211264331970c4df9f317c6a46228f442bfc8da4',gitsha(docx)
          assert gitsha(docx)=='dc779b3f968e7ba8e363b22706e79fb4dc6936b4'
          import base64
          assert os.environ['GITHUB_REPOSITORY']=='pointerHu/WH'
          request=urllib.request.Request('https://api.github.com/repos/pointerHu/WH/git/blobs',data=json.dumps({'content':base64.b64encode(docx).decode(),'encoding':'base64'}).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','User-Agent':'requested-manuscript-cgta-rename'})
          with urllib.request.urlopen(request,timeout=90) as response:
              result=json.load(response)
          assert result['sha']==gitsha(docx)
          print(json.dumps({'verified':True,'blob_sha':result['sha'],'sha256':hashlib.sha256(docx).hexdigest(),'changed_parts':['word/document.xml'],'size':len(docx)}))
          PY
