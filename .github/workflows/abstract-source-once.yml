name: Prepare verified abstract-only manuscript edit once
on:
  push:
    branches: [manuscript-read-20260918]
    paths: [.github/workflows/abstract-source-once.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 6727e1d89b44d99404a19e253b0317d6cde8c531
          persist-credentials: false
      - name: Insert only the reviewed abstract and verify the complete DOCX
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          from io import BytesIO
          from xml.sax.saxutils import escape
          import base64, hashlib, json, os, urllib.request
          import xml.etree.ElementTree as ET
          repo = os.environ['GITHUB_REPOSITORY']
          assert repo == 'pointerHu/WH'
          source = Path('论文方案/王虎-论文-0917.docx').read_bytes()
          assert hashlib.sha256(source).hexdigest() == '629c7d435842f242e834442a1c781f49cfbe6bce4e5ae4c1080ca4ad0fe1ba12'
          abstract = ('视听广义零样本学习旨在联合利用音频、视觉与类别语义信息，实现对已见类别和未见类别的统一识别。'
          '尽管AVCA和ClipClap-GZSL等方法在多模态特征融合方面取得了一定进展，但类别语义主要作为最终匹配阶段的静态参照，难以在时序编码过程中主动定位类别相关的局部证据。'
          '此外，相近类别原型的可分性不足，以及弱视听关联与模态噪声引起的信息干扰，进一步限制了模型的泛化能力。'
          '为解决上述问题，我们提出语义引导高斯时序定位的视听广义零样本学习方法（SGTG-AVGZSL），将类别语义作为条件信号贯穿时序编码与交互融合全过程。'
          '具体而言，我们结合视觉与听觉细粒度描述以及CLIP、CLAP文本编码器构建初始类别原型，并通过判别性语义原型优化兼顾类别分离与语义拓扑保持，为时序定位提供可迁移的语义查询。'
          '随后，我们设计语义引导高斯时序定位模块，以类别语义条件化视听序列，通过视觉与音频独立的多高斯专家及自适应路由，在两条时间轴上连续定位并汇聚类别相关片段，减轻冗余背景对判别证据的稀释。'
          '进一步地，通过解耦模态交互与门控融合，分别建模模态内与模态间关系，并以样本和候选类别为条件，动态整合模态内表示、跨模态表示与直接时序证据，抑制模态干扰并保留互补信息。'
          '在VGGSound-GZSL{cls}、UCF-GZSL{cls}和ActivityNet-GZSL{cls}三个基准数据集上的实验结果表明，所提出的方法在调和平均值上均优于对比方法，有效改善了已见类别识别与未见类别泛化之间的平衡。')
          heading = '<w:r><w:rPr><w:rFonts w:ascii="Times New Roman" w:hAnsi="Times New Roman" w:eastAsia="黑体" w:cs="Times New Roman"/><w:b/><w:i w:val="0"/><w:sz w:val="36"/></w:rPr><w:t>摘要</w:t></w:r>'
          fonts = '<w:rFonts w:ascii="Times New Roman" w:hAnsi="Times New Roman" w:eastAsia="宋体" w:cs="Times New Roman"/>'
          def run(text, superscript=False):
              props = fonts + '<w:b w:val="0"/>'
              props += '<w:i/>' if superscript else '<w:i w:val="0"/>'
              props += '<w:sz w:val="21"/>'
              if superscript:
                  props += '<w:vertAlign w:val="superscript"/>'
              return '<w:r><w:rPr>' + props + '</w:rPr><w:t>' + escape(text) + '</w:t></w:r>'
          paragraph = '<w:p><w:pPr><w:keepNext w:val="0"/><w:keepLines/><w:pageBreakBefore w:val="0"/><w:widowControl/><w:spacing w:before="0" w:after="0" w:line="360" w:lineRule="auto"/><w:ind w:left="0" w:right="0" w:firstLine="420"/><w:jc w:val="both"/></w:pPr>'
          for i, text in enumerate(abstract.split('{cls}')):
              if i:
                  paragraph += run('cls', True)
              if text:
                  paragraph += run(text)
          paragraph += '</w:p>'
          addition = (heading + '</w:p>' + paragraph).encode()
          output = BytesIO()
          with ZipFile(BytesIO(source)) as src:
              xml = src.read('word/document.xml')
              start = xml.index(b'<w:body>') + len(b'<w:body>')
              end = xml.index(b'</w:p>', start)
              assert b'<w:t' not in xml[start:end]
              newxml = xml[:end] + addition + xml[end+len(b'</w:p>'):]
              ET.fromstring(newxml)
              assert newxml.replace(addition, b'</w:p>', 1) == xml
              with ZipFile(output, 'w') as dst:
                  dst.comment = src.comment
                  for info in src.infolist():
                      dst.writestr(info, newxml if info.filename == 'word/document.xml' else src.read(info.filename))
          result = output.getvalue()
          assert len(result) == 9583616
          digest = hashlib.sha256(result).hexdigest()
          assert digest == 'f2037b754167bfb1010a4298ecf6bb19f7ea4df7e550722ea4fbf9f2b97d3a09', digest
          with ZipFile(BytesIO(source)) as a, ZipFile(BytesIO(result)) as b:
              assert a.namelist() == b.namelist()
              assert [n for n in a.namelist() if a.read(n) != b.read(n)] == ['word/document.xml']
              assert b.testzip() is None
          request = urllib.request.Request('https://api.github.com/repos/' + repo + '/git/blobs', data=json.dumps({'content':base64.b64encode(result).decode(), 'encoding':'base64'}).encode(), headers={'Authorization':'Bearer ' + os.environ['GH_TOKEN'], 'Accept':'application/vnd.github+json', 'Content-Type':'application/json', 'User-Agent':'requested-abstract-edit'})
          with urllib.request.urlopen(request, timeout=90) as response:
              uploaded = json.load(response)
          assert uploaded['sha'] == '89475a63cace84da1bb22219a89c2c6ee3886bbf'
          print(json.dumps({'verified':True,'blob_sha':uploaded['sha'],'sha256':digest,'size':len(result),'changed_parts':['word/document.xml']}))
          PY
