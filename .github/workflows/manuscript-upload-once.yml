name: Upload requested manuscript revision once
on:
  push:
    branches: [manuscript-read-20260918]
    paths: [.github/workflows/manuscript-upload-once.yml]
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reassemble and verify the exact previously delivered DOCX
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, io, json, lzma, os, urllib.request, zipfile
          from pathlib import Path
          repo = os.environ['GITHUB_REPOSITORY']
          assert repo == 'pointerHu/WH'
          root = 'https://api.github.com/repos/' + repo + '/git/blobs'
          def api(url, body=None):
              data = None if body is None else json.dumps(body).encode()
              request = urllib.request.Request(url, data=data, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'Content-Type': 'application/json',
                  'User-Agent': 'requested-manuscript-upload'})
              with urllib.request.urlopen(request, timeout=90) as response:
                  return json.load(response)
          fragments = ['de8757bde949d652e963bea80483be0bf67d1b72',
                       'b85205449197234ce8a041b61c992db1572101c3',
                       '4560774cfcb31bcbe93ccde543e17209ba4fb184']
          compressed = b''.join(base64.b64decode(api(root + '/' + sha)['content']) for sha in fragments)
          delta = lzma.decompress(compressed)
          source = Path('论文方案/王虎-论文-0917.docx').read_bytes()
          assert hashlib.sha256(source).hexdigest() == 'ab42ea5691260c997677ba8ca307d443b70c03967630baecf0243545bfb5d2e4', 'Source version mismatch'
          with zipfile.ZipFile(io.BytesIO(source)) as archive:
              original = b'\x00' + b''.join(archive.read(name) for name in archive.namelist())
          def apply(base, delta):
              position = 0
              def varint():
                  nonlocal position
                  value = shift = 0
                  while True:
                      byte = delta[position]
                      position += 1
                      value |= (byte & 127) << shift
                      if not byte & 128:
                          return value
                      shift += 7
              assert varint() == len(base)
              expected = varint()
              assert expected < 30000000
              output = bytearray()
              while position < len(delta):
                  opcode = delta[position]
                  position += 1
                  if opcode & 128:
                      offset = size = 0
                      for k in range(4):
                          if opcode & (1 << k):
                              offset |= delta[position] << (8*k)
                              position += 1
                      for k in range(3):
                          if opcode & (16 << k):
                              size |= delta[position] << (8*k)
                              position += 1
                      size = size or 65536
                      assert offset + size <= len(base)
                      output.extend(base[offset:offset+size])
                  else:
                      assert opcode and position + opcode <= len(delta)
                      output.extend(delta[position:position+opcode])
                      position += opcode
              assert len(output) == expected
              return bytes(output)
          contents = apply(original, delta)
          entries = [
              ('[Content_Types].xml',2811,4),('_rels/.rels',736,4),
              ('word/document.xml',1169939,4),('word/_rels/document.xml.rels',2523,4),
              ('word/footer3.xml',1299,4),('word/footer2.xml',1299,4),
              ('word/footer1.xml',1664,4),('word/header2.xml',1299,4),
              ('word/header1.xml',1299,4),('word/endnotes.xml',1596,4),
              ('word/footnotes.xml',1652,4),('word/settings.xml',3441,4),
              ('word/people.xml',1397,4),('word/fontTable.xml',3614,4),
              ('word/media/image3.png',231629,4),('word/media/image2.emf',1479240,4),
              ('word/embeddings/oleObject2.bin',875008,4),('word/media/image1.emf',3450780,4),
              ('word/embeddings/oleObject1.bin',6159872,4),('word/theme/theme1.xml',6437,6),
              ('word/styles.xml',65909,6),('word/comments.xml',5450,6),
              ('docProps/core.xml',719,6),('docProps/app.xml',638,6),('docProps/custom.xml',750,6)]
          output = io.BytesIO()
          cursor = 1
          with zipfile.ZipFile(output, 'w') as archive:
              for name, size, second in entries:
                  info = zipfile.ZipInfo(name, (2026,9,18,2,19,second))
                  info.external_attr = 25165824
                  info.create_system = 3
                  info.compress_type = zipfile.ZIP_DEFLATED
                  archive.writestr(info, contents[cursor:cursor+size], compresslevel=6)
                  cursor += size
          assert cursor == len(contents)
          docx = output.getvalue()
          assert len(docx) == 9534818
          digest = hashlib.sha256(docx).hexdigest()
          assert digest == '84070d94a1ecf91ffc5de79e77ba70af023f6f331b3916046f6e8e40e6efea24', 'Target checksum mismatch: ' + digest
          with zipfile.ZipFile(io.BytesIO(docx)) as archive:
              assert archive.testzip() is None
          result = api(root, {'content': base64.b64encode(docx).decode(), 'encoding': 'base64'})
          assert result['sha'] == '3f350c8098e982f640c8b966cc9caba409ac1ec1'
          print(json.dumps({'verified': True, 'blob_sha': result['sha'], 'sha256': digest, 'size': len(docx)}))
          PY
