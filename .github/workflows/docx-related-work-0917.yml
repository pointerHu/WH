name: DOCX related-work editing
on:
  push:
    branches: [edit/related-work-docx-0917]
    paths:
      - '.github/workflows/docx-related-work-0917.yml'
      - '.docx-edit-0917/**'
permissions:
  contents: write
jobs:
  revise:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: edit/related-work-docx-0917
      - name: Install XML dependency
        run: python3 -m pip install lxml==6.1.1
      - name: Apply validated related-work and bibliography patch
        run: |
          mkdir -p docx-revised
          python3 .docx-edit-0917/revise_docx.py '论文方案/王虎-论文-0917.docx' 'docx-revised/王虎-论文-0917.docx' --report docx-revised/audit.json
          python3 - <<'PY'
          import json, pathlib
          r=json.loads(pathlib.Path('docx-revised/audit.json').read_text())
          assert r['document_xml_sha256']=='9f76ef01a160233d296718df328bab97c3bdd88bfc22914504191d802090eba5', 'Output differs from locally rendered and reviewed document.'
          assert r['reference_count_after']==27 and r['all_citations_resolve'] and r['non_related_content_preserved']
          PY
      - name: Store only revised DOCX on helper branch
        run: |
          cp 'docx-revised/王虎-论文-0917.docx' '论文方案/王虎-论文-0917.docx'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '论文方案/王虎-论文-0917.docx'
          git commit -m 'docs: apply related-work rewrite and synchronize references in original DOCX'
          git push origin HEAD:refs/heads/edit/related-work-docx-0917
          git rev-parse HEAD | tee docx-revised/commit-sha.txt
          git rev-parse 'HEAD:论文方案/王虎-论文-0917.docx' | tee docx-revised/blob-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: docx-revised-0917
          path: docx-revised/
          retention-days: 1
